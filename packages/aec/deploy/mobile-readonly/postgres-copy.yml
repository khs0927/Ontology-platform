# Restored copy of the AEC database for the read-only API. Not the PC database.
# `docker compose up` in packages/aec does not load this file.
# Container name, volume, and host port are deliberately different from the PC stack.
# See docs/ops/PC-INDEPENDENT-RUNTIME.md before restoring a dump.
#
#   cp env.example .env    # set AEC_COPY_DB_PASSWORD before this file will start
#   docker compose -f packages/aec/deploy/mobile-readonly/postgres-copy.yml up -d
#
# Then restore a logical dump and apply reader-role.sql. See docs/ops/PC-INDEPENDENT-RUNTIME.md.
# Do not mount the PC data disk or the Google Drive drive letter here.

name: aec-mobile-readonly

services:
  db-copy:
    build:
      context: ../../docker
      dockerfile: Dockerfile.db
    image: aec-postgres-age:16-1.6.0
    container_name: aec-db-copy
    ports:
      - "127.0.0.1:${AEC_COPY_DB_PORT:-55433}:5432"
    environment:
      POSTGRES_DB: aec
      POSTGRES_USER: aec
      POSTGRES_PASSWORD: ${AEC_COPY_DB_PASSWORD:?AEC_COPY_DB_PASSWORD_is_required}
    volumes:
      - aec-mobile-pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=age
      - -c
      - shared_buffers=256MB
      - -c
      - max_wal_size=512MB
    shm_size: 256m
    stop_grace_period: 10m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aec -d aec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aec-mobile-pgdata:
