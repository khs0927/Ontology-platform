[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "god-cad"
version = "0.1.0"
description = "An evidence-linked CAD understanding and edit-planning foundation"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4.4,<2",
    "pydantic>=2.11,<3",
    "Pillow>=11,<13",
    "numpy>=2,<2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5", "rdflib>=7,<8"]

[project.scripts]
god-cad = "god_cad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/god_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
