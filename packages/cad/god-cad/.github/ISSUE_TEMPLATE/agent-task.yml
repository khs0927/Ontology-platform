name: Agent implementation task
description: 구현 범위와 검증 조건이 있는 에이전트 작업
title: "[Gxx] "
body:
  - type: input
    id: task
    attributes:
      label: 작업 ID와 선행 조건
      placeholder: G01 / S00
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 구체적인 완료 동작
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 담당 파일과 계약 변경
  - type: textarea
    id: acceptance
    attributes:
      label: 입력 fixture와 완료 판정
      description: 정상/실패/미지원 및 원본 보존 검증을 명시합니다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 필요한 환경과 아직 확보되지 않은 조건
