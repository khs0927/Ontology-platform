[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "sion-ontology-platform"
version = "0.2.0"
description = "Local-first ontology, knowledge graph and GraphRAG platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "sqlalchemy==2.1.3",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
graphrag = [
  "lightrag-hku==1.5.7",
  "asyncpg==0.32.0",
  "pgvector==0.5.0",
]
drive = [
  "google-api-python-client>=2.201,<3",
  "google-auth>=2.60,<3",
]
dxf = [
  "ezdxf>=1.4.4,<2",
]
ifc = [
  "ifcopenshell>=0.9,<0.10",
]
dev = [
  "ruff==0.16.10",
  "build==1.6.1",
]
all = [
  "sion-ontology-platform[graphrag,drive,dxf,ifc]",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E402"]  # existing upstream style; tighten later

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["sion_api", "sion_ingestion", "sion_drive_store", "sion_graphrag"]

[tool.setuptools.package-dir]
sion_api = "apps/api/sion_api"
sion_ingestion = "packages/ingestion/sion_ingestion"
sion_drive_store = "packages/drive-store/sion_drive_store"
sion_graphrag = "packages/graphrag/sion_graphrag"
