[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "sion-ontology-platform"
version = "0.3.0"
description = "Local-first ontology, knowledge graph and GraphRAG platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "sqlalchemy==2.1.3",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
]

[project.scripts]
sion-migrate = "sion_api.migrate:main"
sion-relations = "sion_ingestion.relations_cli:main"
god-cad = "god_cad.cli:main"
aec = "aec_intelligence.cli:main"
aec-mcp = "aec_intelligence.mcp_stdio:main"
aec-mcp-http = "aec_intelligence.mcp_http:main"
sion-mcp = "sion_api.mcp_server:main"

[project.optional-dependencies]
# Feature extras (install only what you need; the core install stays light)
cad = [
  "ezdxf>=1.4.4,<2",
  # GOD-CAD analysis (packages/cad/god-cad): preview rendering and geometry
  "Pillow>=11,<14",
  "numpy>=2,<2.5",
]
bim = [
  "ifcopenshell>=0.9,<0.10",
]
rag = [
  "lightrag-hku==1.5.7",
  "asyncpg==0.32.0",
  "pgvector==0.5.0",
]
drive = [
  "google-api-python-client>=2.201,<3",
  "google-auth>=2.60,<3",
]
# ArchOntos (rule evaluator, regulation services, migrator) is a real dependency, pinned to
# one commit of khs0927/ArchOntos -- never vendored (tests/test_archontos_dependency.py).
# Bump the SHA here and in docs/INTEGRATION_CONTRACTS.md together, then `uv lock`.
regulation = [
  "archontos @ git+https://github.com/khs0927/ArchOntos@a9e268651140b90a38e2867fa0f8ca37c24d13c5 ; python_version < '3.15'",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]==2.1.3",
  "asyncpg==0.32.0",
  "pgvector==0.5.0",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]
# PDF / DOCX document ingest (without it: DOCX via the built-in OOXML reader, PDF skipped)
documents = [
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
]
# Remote MCP server for the knowledge core (`sion-mcp`; see docs/MCP_SERVER.md)
mcp = [
  "mcp==2.3.0",
]
# SHACL validation endpoint GET /api/v1/validation/shacl (without it: 503)
validation = [
  "rdflib>=7.6,<8",
  "pyshacl>=0.40.1,<1",
]
all = [
  "sion-ontology-platform[cad,bim,rag,drive,regulation,documents,validation,mcp]",
]
# Tooling
test = [
  "httpx==0.28.1",
  "httpx2==2.13.1",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  # Drawing benchmark render (packages/embedhub/bench/build_drawings_dataset.py). CI only.
  "matplotlib>=3.9,<4",
]
dev = [
  "sion-ontology-platform[test]",
  "ruff==0.16.10",
  "build==1.6.1",
]
# khs0927/Ontology DXF/IFC ingestion through sion_cair.ingest (consolidation phase 1).
# The aec_intelligence code itself ships in this distribution (packages/aec subtree);
# this extra only pulls its parser dependencies. For an external or pinned Ontology,
# see docs/INTEGRATION_CONTRACTS.md section 11.
aec = ["sion-ontology-platform[cad,bim]"]
# Backwards-compatible aliases (0.1.x names)
dxf = ["sion-ontology-platform[cad]"]
ifc = ["sion-ontology-platform[bim]"]
graphrag = ["sion-ontology-platform[rag]"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E402"]  # existing upstream style; tighten later

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q --import-mode=importlib"
# Subtree packages under packages/ ship test suites that import modules which are
# not installed as distributions (extension dirs). Put those roots on sys.path so `pytest` from the repo root collects them.
pythonpath = [
  "tests",  # tests/ modules import sibling helpers (importlib mode drops rootdir insertion)
  "packages/aec/tests",  # AEC acceptance suites import the sibling _runtimes helper
  "packages/aec/extensions/drawing_context",
  "packages/aec/extensions/external_capabilities",
  "packages/aec/extensions/intelligence_fabric",
]

[tool.setuptools]
packages = [
  "sion_api",
  "sion_core",
  "sion_core.contracts",
  "sion_core.contracts.schemas",
  "sion_ingestion",
  "sion_cad",
  "sion_bim",
  "sion_cair",
  "sion_drive_store",
  "sion_graphrag",
  "sion_embedhub",
  "sion_eval",
  # Overlapping-regulation review workflow. ArchOntos itself stays a pinned
  # dependency; this package calls archontos.rules and is not a vendored copy.
  "sion_regulation",
  "sion_regulation.review",
  # GOD-CAD (git subtree at packages/cad/god-cad)
  "god_cad",
  "god_cad.adapters",
  # khs0927/Ontology AEC/CAIR engine (git subtree at packages/aec)
  "aec_intelligence",
  "aec_intelligence.operational",
  "aec_intelligence.operational.graphrag",
]

[tool.setuptools.package-dir]
sion_api = "apps/api/sion_api"
sion_core = "packages/core/sion_core"
sion_ingestion = "packages/ingestion/sion_ingestion"
sion_cad = "packages/cad/sion_cad"
sion_bim = "packages/bim/sion_bim"
sion_cair = "packages/cair/sion_cair"
sion_drive_store = "packages/drive-store/sion_drive_store"
sion_graphrag = "packages/graphrag/sion_graphrag"
sion_embedhub = "packages/embedhub/sion_embedhub"
sion_eval = "packages/eval/sion_eval"
sion_regulation = "packages/regulation/src/sion_regulation"
god_cad = "packages/cad/god-cad/src/god_cad"
aec_intelligence = "packages/aec/src/aec_intelligence"

[tool.setuptools.package-data]
sion_api = ["*.html"]
sion_core = ["contracts/schemas/*.json"]
aec_intelligence = [
  "resources/*.json",
  "resources/*.ttl",
  "operational/migrations/*.sql",
  "operational/web/*.html",
]
