[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "sion-ontology-platform"
version = "0.2.0"
description = "Local-first ontology, knowledge graph and GraphRAG platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "sqlalchemy==2.1.3",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
sion-migrate = "sion_api.migrate:main"
sion-relations = "sion_ingestion.relations_cli:main"
god-cad = "god_cad.cli:main"
aec = "aec_intelligence.cli:main"
aec-mcp = "aec_intelligence.mcp_stdio:main"
aec-mcp-http = "aec_intelligence.mcp_http:main"

[project.optional-dependencies]
# Feature extras (install only what you need; the core install stays light)
cad = [
  "ezdxf>=1.4.4,<2",
  # GOD-CAD analysis (packages/cad/god-cad): preview rendering and geometry
  "Pillow>=11,<13",
  "numpy>=2,<2.5",
]
bim = [
  "ifcopenshell>=0.9,<0.10",
]
rag = [
  "lightrag-hku==1.5.7",
  "asyncpg==0.32.0",
  "pgvector==0.5.0",
]
drive = [
  "google-api-python-client>=2.201,<3",
  "google-auth>=2.60,<3",
]
# ArchOntos regulation services (packages/regulation). The rule evaluator itself only needs
# the core deps; this extra adds what the services, migrator and storage adapters import.
regulation = [
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]==2.1.3",
  "asyncpg==0.32.0",
  "pgvector==0.5.0",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]
# PDF / DOCX document ingest (without it: DOCX via the built-in OOXML reader, PDF skipped)
documents = [
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
]
# SHACL validation endpoint GET /api/v1/validation/shacl (without it: 503)
validation = [
  "rdflib>=7.6,<8",
  "pyshacl>=0.40.1,<1",
]
all = [
  "sion-ontology-platform[cad,bim,rag,drive,regulation,documents,validation]",
]
# Tooling
test = [
  "httpx==0.28.1",
  "httpx2==2.13.1",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
]
dev = [
  "sion-ontology-platform[test]",
  "ruff==0.16.10",
  "build==1.6.1",
]
# Backwards-compatible aliases (0.1.x names)
dxf = ["sion-ontology-platform[cad]"]
ifc = ["sion-ontology-platform[bim]"]
graphrag = ["sion-ontology-platform[rag]"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E402"]  # existing upstream style; tighten later

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = [
  "sion_api",
  "sion_core",
  "sion_core.contracts",
  "sion_core.contracts.schemas",
  "sion_ingestion",
  "sion_cad",
  "sion_bim",
  "sion_cair",
  "sion_drive_store",
  "sion_graphrag",
  # ArchOntos (git subtree at packages/regulation, src layout)
  "archontos",
  "archontos.actions",
  "archontos.assertions",
  "archontos.db",
  "archontos.domain",
  "archontos.graph",
  "archontos.ingestion",
  "archontos.integration",
  "archontos.normalization",
  "archontos.projection",
  "archontos.query",
  "archontos.rules",
  "archontos.storage",
  # GOD-CAD (git subtree at packages/cad/god-cad)
  "god_cad",
  "god_cad.adapters",
  # khs0927/Ontology AEC/CAIR engine (git subtree at packages/aec)
  "aec_intelligence",
  "aec_intelligence.operational",
  "aec_intelligence.operational.graphrag",
]

[tool.setuptools.package-dir]
sion_api = "apps/api/sion_api"
sion_core = "packages/core/sion_core"
sion_ingestion = "packages/ingestion/sion_ingestion"
sion_cad = "packages/cad/sion_cad"
sion_bim = "packages/bim/sion_bim"
sion_cair = "packages/cair/sion_cair"
sion_drive_store = "packages/drive-store/sion_drive_store"
sion_graphrag = "packages/graphrag/sion_graphrag"
archontos = "packages/regulation/src/archontos"
god_cad = "packages/cad/god-cad/src/god_cad"
aec_intelligence = "packages/aec/src/aec_intelligence"

[tool.setuptools.package-data]
sion_core = ["contracts/schemas/*.json"]
aec_intelligence = [
  "resources/*.json",
  "resources/*.ttl",
  "operational/migrations/*.sql",
  "operational/web/*.html",
]
