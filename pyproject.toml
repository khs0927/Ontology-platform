[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sion-ontology-platform"
version = "0.1.0"
description = "Local-first ontology, knowledge graph and GraphRAG platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "uvicorn==0.53.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
graphrag = [
  "lightrag-hku==1.5.7",
  "asyncpg==0.31.0",
  "pgvector==0.5.0",
]
ingest = [
  "ezdxf>=1.4,<2",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
]
validation = [
  "rdflib>=7.1,<8",
  "pyshacl>=0.40,<1",
]
build = [
  "build>=1.2",
  "pyinstaller>=6.10",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["sion_api", "sion_ingestion", "sion_drive_store", "sion_graphrag"]

[tool.setuptools.package-dir]
sion_api = "apps/api/sion_api"
sion_ingestion = "packages/ingestion/sion_ingestion"
sion_drive_store = "packages/drive-store/sion_drive_store"
sion_graphrag = "packages/graphrag/sion_graphrag"
