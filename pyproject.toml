[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-platform"
version = "0.1.0"
description = "Local-first ontology, knowledge graph and GraphRAG platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/drive-store", "packages/map-bridge"]
include = ["ontology_api*", "ontology_drive_store*", "ontology_map_bridge*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/drive-store", "packages/map-bridge"]
testpaths = ["tests"]
