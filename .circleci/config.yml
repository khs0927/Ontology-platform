version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
      - image: pgvector/pgvector:0.8.6-pg17
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ontology_platform

    environment:
      ONTOLOGY_PG_DSN: postgresql://postgres:postgres@localhost:5432/ontology_platform
      ONTOLOGY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ontology_platform
      ONTOLOGY_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ontology_platform
      ONTOLOGY_SECURITY_MODE: disabled
      ONTOLOGY_RESTORE_PG_DSN: postgresql://postgres:postgres@localhost:5432/ontology_restore_test
      ONTOLOGY_RESTORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ontology_restore_test

    steps:
      - checkout

      - run:
          name: Install PostgreSQL 17 client
          command: |
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/postgresql.gpg
            CODENAME=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")
            echo "deb https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17

      - run:
          name: Install locked project dependencies
          command: |
            python -m pip install uv==0.12.17
            uv sync --locked --extra dev

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in $(seq 1 60); do
              if pg_isready -h localhost -p 5432 -U postgres -d ontology_platform; then
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL did not become ready" >&2
            exit 1

      - run:
          name: Apply canonical migrations
          command: |
            bash scripts/apply_migrations.sh
            bash scripts/apply_migrations.sh

      - run:
          name: Verify PostgreSQL and pgvector
          command: uv run python scripts/verify_postgres.py

      - run:
          name: Run test suite
          command: |
            mkdir -p test-results
            uv run pytest -q --junitxml=test-results/pytest.xml

      - run:
          name: Verify PostgreSQL backup restore
          command: bash scripts/verify_postgres_restore.sh

      - store_test_results:
          path: test-results

workflows:
  validate:
    jobs:
      - test
