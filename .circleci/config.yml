version: 2.1

# Mirrors .github/workflows/tests.yml so the connected CircleCI project
# reports the same pytest result instead of "no configuration".
jobs:
  pytest:
    docker:
      - image: cimg/python:3.12
      # The image's SQLite (3.37) is older than DBOS needs for a SQLite system database,
      # so the durable-jobs tests run against PostgreSQL here (tests/test_ingest_jobs.py).
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: sion
          POSTGRES_PASSWORD: sion
          POSTGRES_DB: sion_test
    environment:
      SION_TEST_JOBS_POSTGRES_URL: postgresql+psycopg://sion:sion@localhost:5432/sion_test
    steps:
      - checkout
      - run:
          name: Install package with all optional extras
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[all,test,dev]"
      - run:
          name: Wait for PostgreSQL
          command: |
            python - <<'PY'
            import time, psycopg
            for _ in range(60):
                try:
                    psycopg.connect("postgresql://sion:sion@localhost:5432/sion_test").close()
                    break
                except psycopg.OperationalError:
                    time.sleep(1)
            else:
                raise SystemExit("PostgreSQL did not start")
            PY
      - run:
          name: Run tests
          command: |
            ruff check .
            python -m pytest

workflows:
  tests:
    jobs:
      - pytest
