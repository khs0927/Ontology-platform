version: 2.1

# Mirrors .github/workflows/tests.yml so the connected CircleCI project
# reports the same pytest result instead of "no configuration".
jobs:
  pytest:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install package with all optional extras
          command: |
            python -m pip install --upgrade pip
            python -m pip install -e ".[all,test,dev]"
      - run:
          name: Run tests
          command: |
            ruff check .
            python -m pytest

workflows:
  tests:
    jobs:
      - pytest
