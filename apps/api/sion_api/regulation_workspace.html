<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>프로젝트 법규 검토</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 20px;color:#182a38;background:#f5f7fa}section{background:white;padding:24px;margin:20px 0;border-radius:12px}input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 16px;border:1px solid #b7c5d1;border-radius:5px}button{padding:10px 18px;margin:4px;background:#175a72;color:white;border:0;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}#message{white-space:pre-wrap}</style>
<h1>프로젝트 법규 검토</h1><p>검토 근거를 프로젝트에 저장하고, 작업 메모와 후속 과제를 함께 브리핑합니다.</p>
<section><label>플랫폼 접근 토큰 (원격 접근 시)<input id="token" type="password" autocomplete="off"></label>
<label>프로젝트<select id="project"></select></label><label>새 프로젝트 이름<input id="projectName"></label><button id="createProject">프로젝트 생성</button><button id="refresh">작업 불러오기</button></section>
<section><h2>법규 검토</h2><label>검토 제목<input id="title" value="건축 법규 검토"></label><label>질문<textarea id="question">건축법상 검토할 사항을 정리해줘</textarea></label><label>대지 주소 (선택)<input id="address"></label><label>법령 기준일<input id="asof" type="date"></label><label>작업 메모<textarea id="notes"></textarea></label><label>후속 작업 (한 줄에 하나)<textarea id="tasks"></textarea></label><button id="review">법규 조회</button><button id="save" disabled>프로젝트에 검토 저장</button><p id="message" role="status"></p></section>
<section><h2>중첩규제 검토 실행</h2><p>필지·제안행위·기준일을 고정해 검토 범위를 만들고, 미확인 항목과 다음 작업을 함께 확인합니다. 결과는 근거 정리이며 허가 판단이 아닙니다.</p><label>제안 revision<input id="rvRevision" value="r1"></label><label>제안행위 (쉼표로 구분)<input id="rvActions" value="new_construction"></label><label>용도 (쉼표로 구분)<input id="rvUses"></label><label>PNU (확정된 필지, 19자리)<input id="rvPnu" inputmode="numeric" maxlength="19"></label><label>관할 코드 (시군구 5자리, 미확정이면 비움)<input id="rvJurisdiction" inputmode="numeric" maxlength="5"></label><button id="rvPlan">검토 범위 확인</button><button id="rvStart">검토 실행</button><button id="rvSave" disabled>실행 결과를 프로젝트에 저장</button><div id="rvResult" aria-live="polite"></div></section>
<section><h2>저장한 검토 작업</h2><div id="works"></div></section><section><h2>브리핑</h2><pre id="brief"></pre><button id="download">브리핑 내려받기</button></section>
<script>
const $=id=>document.getElementById(id);let run=null,current=null,review=null;
$('asof').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
async function api(path,body){const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;if(body)headers['Content-Type']='application/json';const r=await fetch(path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('요청 실패 ('+r.status+'): '+await r.text());return r.headers.get('content-type').includes('application/json')?r.json():r.text()}
function tasks(){return $('tasks').value.split('\n').map(x=>x.trim()).filter(Boolean)}
async function projects(){const selected=$('project').value;const rows=await api('/api/v1/entities?limit=1000');$('project').replaceChildren(...rows.filter(x=>x.entity_type_id==='Project').map(x=>new Option(x.name,x.id)));if(selected)$('project').value=selected;await works()}
async function works(){const p=$('project').value;if(!p){$('works').textContent='프로젝트를 생성하거나 선택하세요.';return}const rows=await api('/api/v1/regulation/works?project_id='+p);$('works').replaceChildren();for(const w of rows){const b=document.createElement('button');b.textContent=w.title+' · '+w.status;b.onclick=()=>act(async()=>{current=w.id;$('notes').value=w.notes;$('tasks').value=w.tasks.join('\n');$('brief').textContent=await api('/api/v1/regulation/works/'+w.id+'/briefing');await works()});$('works').append(b)}if(current){const b=document.createElement('button');b.textContent='선택 작업의 메모·과제 저장';b.onclick=()=>act(async()=>{await api('/api/v1/regulation/works/'+current,{notes:$('notes').value,tasks:tasks(),status:'in_review'});$('brief').textContent=await api('/api/v1/regulation/works/'+current+'/briefing');await works()});$('works').append(b)}}
async function act(fn){try{$('message').textContent='진행 중…';await fn();$('message').textContent='완료'}catch(e){$('message').textContent=e.message}}
$('createProject').onclick=()=>act(async()=>{const name=$('projectName').value.trim();if(!name)throw Error('프로젝트 이름을 입력하세요.');const p=await api('/api/v1/entities',{stable_key:'project:'+crypto.randomUUID(),entity_type_id:'Project',name});await projects();$('project').value=p.id;await works()});
$('refresh').onclick=()=>act(projects);$('project').onchange=()=>{current=null;act(works)};
$('review').onclick=()=>act(async()=>{run=null;$('save').disabled=true;const q={question:$('question').value,as_of:$('asof').value,action:'research'};if($('address').value.trim())q.address=$('address').value.trim();const x=await api('/api/v1/regulation/gateway/report',q);run=x.report.request_id;$('brief').textContent='검토 결과: '+x.report.decision.status+'\n'+x.report.decision.reason_codes.join('\n')+'\n\n프로젝트에 저장하면 출처와 법규를 포함한 브리핑을 열 수 있습니다.';$('save').disabled=false});
$('save').onclick=()=>act(async()=>{if(!$('project').value)throw Error('프로젝트를 선택하세요.');const x=await api('/api/v1/regulation/works',{project_id:$('project').value,title:$('title').value,run_id:run,notes:$('notes').value,tasks:tasks()});current=x.work.id;$('brief').textContent=await api('/api/v1/regulation/works/'+current+'/briefing');await works()});
function rvList(x){return x.split(',').map(v=>v.trim()).filter(Boolean)}
function rvBody(){const p=$('project').value;if(!p)throw Error('프로젝트를 선택하세요.');const pnu=$('rvPnu').value.trim();const j=$('rvJurisdiction').value.trim();return{proposal:{project_id:p,revision:$('rvRevision').value.trim()||'r1',actions:rvList($('rvActions').value),uses:rvList($('rvUses').value)},site:{address:$('address').value.trim()||null,pnus:pnu?[pnu]:[],parts:pnu?[{part_id:pnu,pnu}]:[],jurisdiction_code:j||null,resolved:Boolean(pnu)},legal_event_dates:{review_date:$('asof').value}}}
function rvShow(x){const box=$('rvResult');box.replaceChildren();const add=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;box.append(e);return e};const s=x.summary;if(s)add('p','요약 상태: '+s.legacy_status+' · 선언 범위 충족: '+(s.scope_satisfied?'예':'아니오')+' · 미해결: '+(s.has_unresolved?'있음':'없음'));if(x.declared_scope)add('p','검토 범위: '+x.declared_scope.profile_id+' '+x.declared_scope.profile_version+(x.profile_reviewed?'':' (법규 검토자 승인 전 프로필)'));for(const [title,rows,text] of [['검토 항목',x.coverage_items||[],r=>r.label+' · '+r.subject+' · '+r.state],['미확인 항목',x.unresolved_items||[],r=>r.kind+' · '+r.detail],['다음 작업',x.next_tasks||[],r=>r.role+' · '+r.target]]){add('h3',title+' ('+rows.length+')');const u=document.createElement('ul');for(const r of rows){const l=document.createElement('li');l.textContent=text(r);u.append(l)}box.append(u)}}
$('rvPlan').onclick=()=>act(async()=>{review=null;$('rvSave').disabled=true;rvShow(await api('/api/v1/regulation/reviews/plan',rvBody()))});
$('rvStart').onclick=()=>act(async()=>{const x=await api('/api/v1/regulation/reviews',rvBody());review=x.run_id;rvShow(x);$('brief').textContent=await api('/api/v1/regulation/reviews/'+encodeURIComponent(review)+'/briefing?project_id='+$('project').value);$('rvSave').disabled=false});
$('rvSave').onclick=()=>act(async()=>{const x=await api('/api/v1/regulation/reviews/'+encodeURIComponent(review)+'/works',{project_id:$('project').value,title:$('title').value,notes:$('notes').value});if(!x.verified)throw Error('저장 영수증을 확인하지 못했습니다.')});
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([$ ('brief').textContent],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='regulation-briefing.md';a.click();URL.revokeObjectURL(url)};act(projects);
</script></html>
