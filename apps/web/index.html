<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Sion Ontology Map</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    header { padding: 12px 16px; display: flex; gap: 16px; align-items: center; }
    header a { color: #58a6ff; }
    svg { width: 100%; height: calc(100vh - 52px); }
    .node { fill: #1f6feb; }
    text { fill: #eee; font-size: 11px; }
    line { stroke: #8b949e; }
    line.unverified { stroke: #d29922; stroke-dasharray: 4 3; }
    line.human_verified, line.machine_verified { stroke: #2ea043; }
    .legend span { margin-right: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <span>Sion graph · <span id="meta">loading</span></span>
    <span class="legend"><span style="color:#2ea043">― 검증됨</span><span style="color:#d29922">┄ 후보(미검증)</span></span>
    <a href="review">관계 후보 검토</a>
  </header>
  <svg id="map" viewBox="0 0 960 640"></svg>
  <script>
    const params = new URLSearchParams(location.search);
    const api = params.get("api") || (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000");
    fetch(api + "/api/v1/graph?active_only=true")
      .then(r => r.json())
      .then(graph => {
        const nodes = graph.nodes || [];
        const edges = graph.edges || [];
        document.getElementById("meta").textContent = nodes.length + " nodes / " + edges.length + " edges";
        const svg = document.getElementById("map");
        const index = new Map(nodes.map((n, i) => [n.id, i]));
        const pos = nodes.map((_, i) => {
          const angle = (Math.PI * 2 * i) / Math.max(nodes.length, 1);
          return [480 + Math.cos(angle) * 280, 320 + Math.sin(angle) * 220];
        });
        for (const edge of edges) {
          const a = index.get(edge.source);
          const b = index.get(edge.target);
          if (a == null || b == null) continue;
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", pos[a][0]); line.setAttribute("y1", pos[a][1]);
          line.setAttribute("x2", pos[b][0]); line.setAttribute("y2", pos[b][1]);
          line.setAttribute("class", edge.verification_state || "");
          const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
          title.textContent = `${nodes[a].name} -${edge.type}-> ${nodes[b].name} (${edge.verification_state})`;
          line.appendChild(title);
          svg.appendChild(line);
        }
        nodes.forEach((node, i) => {
          const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("cx", pos[i][0]); c.setAttribute("cy", pos[i][1]); c.setAttribute("r", 8);
          c.setAttribute("class", "node");
          svg.appendChild(c);
          const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
          t.setAttribute("x", pos[i][0] + 10); t.setAttribute("y", pos[i][1] + 4);
          t.textContent = node.name || node.stable_key;
          svg.appendChild(t);
        });
      })
      .catch(err => { document.getElementById("meta").textContent = err.message; });
  </script>
</body>
</html>
