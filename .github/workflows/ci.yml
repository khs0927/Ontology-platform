name: CI

on:
  push:
    branches: ["codex/p0-remediation-20260924"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run actual pytest suite
        run: python -m pytest
      - name: Run security and durability contracts
        run: python -m pytest tests/test_auth.py tests/test_dlp.py tests/test_evidence_contract.py tests/test_bridge_upsert.py tests/test_sync_atomic.py tests/test_automation_security.py tests/test_frozen_contract.py -q

  alembic-revision-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Alembic revision contract
        run: python -m pytest tests/test_alembic_contract.py -q
      - name: Verify migrations
        run: test -f migrations/001_core.sql && test -f migrations/002_vector.sql && test -f migrations/versions/0001_baseline.py

  postgres-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: ontology}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ontology
      SION_ALEMBIC_EXECUTE_SCHEMA_CREATE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[test]"
      - name: Upgrade PostgreSQL core schema with Alembic
        run: alembic upgrade head
      - name: Verify Alembic current matches head
        run: |
          alembic current
          alembic heads
          test "$(alembic current | sed 's/ (head)//')" = "$(alembic heads | sed 's/ (head)//')"
      - name: Verify core readiness
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sion_api.health import check_readiness
          result = check_readiness(create_engine(os.environ["SION_DATABASE_URL"]), vector_enabled=False)
          assert result["status"] == "ready", result
          PY
      - name: Run core-only PostgreSQL contracts
        run: python -m pytest tests/test_readiness.py -k "not vector" -q

  postgres-pgvector:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: ontology}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ontology
      SION_ALEMBIC_EXECUTE_SCHEMA_CREATE: "1"
      SION_VECTOR_ENABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[test]"
      - name: Upgrade PostgreSQL schema through vector head with Alembic
        run: alembic upgrade head
      - name: Verify Alembic current matches head
        run: |
          alembic current
          alembic heads
          test "$(alembic current | sed 's/ (head)//')" = "$(alembic heads | sed 's/ (head)//')"
      - name: Verify pgvector readiness
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sion_api.health import check_readiness
          result = check_readiness(create_engine(os.environ["SION_DATABASE_URL"]), vector_enabled=True)
          assert result["status"] == "ready", result
          PY
      - name: Run pgvector-only contracts
        run: python -m pytest tests/test_vector_readiness.py -q

  resource-wheel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Build and clean-install wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel --outdir dist . && python -m venv .clean-venv && .clean-venv/bin/python -m pip install dist/*.whl && .clean-venv/bin/python -c "import sion_api, sion_ingestion, sion_drive_store"
      - name: Verify wheel resources
        run: python -m pytest tests/test_resource_package.py -q
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with: {name: wheel-artifacts, path: dist/*.whl, retention-days: 7}

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan committed secrets
        run: python -c "import pathlib,re,sys; files=[p for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and '.venv' not in p.parts]; bad=[str(p) for p in files if re.search(r'(?i)(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|aws_access_key_id\s*=|sk-[A-Za-z0-9]{20,})', p.read_text(errors='ignore'))]; print('\n'.join(bad)); sys.exit(bool(bad))"
