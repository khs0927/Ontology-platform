name: NVIDIA official semantic compilation and NL2SQL - isolated live E2E

on:
  push:
    branches: [feat/nvidia-auto-ontology-federation-20261107]
    paths:
      - .github/workflows/nvidia-official-live-e2e.yml
      - integrations/nvidia-auto-ontology/ci/prepare_live_env.py
      - integrations/nvidia-auto-ontology/ci/official_live_pipeline.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-inference:
    if: github.repository == 'khs0927/Ontology-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: nvidia-official-semantic-ci
      cancel-in-progress: true
    steps:
      - name: Free disk for pinned NVIDIA image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Use public DNS resolvers for Docker builds
        run: |
          # The pinned upstream Dockerfiles apt-get from Ubuntu during the image
          # build. When the runner resolver blips, archive.ubuntu.com becomes
          # unresolvable inside build containers and the build fails before any
          # Sion or NVIDIA assertion. No compose service exists yet, so a dockerd
          # reload here is safe. Restore the runner config if it does not boot.
          if [ -f /etc/docker/daemon.json ]; then sudo cp /etc/docker/daemon.json /tmp/daemon.json.orig; fi
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json >/dev/null <<'EOF'
          {
            "dns": ["1.1.1.1", "8.8.8.8"]
          }
          EOF
          if ! sudo systemctl restart docker || ! timeout 90 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'; then
            echo "Docker did not come back with the DNS override; restoring previous config" >&2
            if [ -f /tmp/daemon.json.orig ]; then sudo cp /tmp/daemon.json.orig /etc/docker/daemon.json; else sudo rm -f /etc/docker/daemon.json; fi
            sudo systemctl restart docker
            timeout 90 bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
          fi
          docker info >/dev/null

      - name: Checkout isolated Sion branch
        uses: actions/checkout@v7.0.1

      - name: Checkout pinned NVIDIA Auto Ontology
        uses: actions/checkout@v7.0.1
        with:
          repository: NVIDIA/auto-ontology
          ref: c447003f72a822301e927196a4ecb5b597c308d5
          path: nvidia

      - name: Create temporary isolated environment
        run: python integrations/nvidia-auto-ontology/ci/prepare_ephemeral_env.py

      - name: Configure real NVIDIA NIM models in temp file (never output credentials)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python integrations/nvidia-auto-ontology/ci/prepare_live_env.py

      - name: Boot disposable PostgreSQL only
        working-directory: nvidia
        run: |
          docker compose -f docker-compose.yml -f ../integrations/nvidia-auto-ontology/ci/docker-compose.ci.yml up -d --wait postgres

      - name: Seed synthetic canonical Sion fixture and restricted reader
        run: |
          export PGPASSWORD="$(awk -F= '$1=="POSTGRES_PASSWORD"{print $2}' nvidia/.env)"
          export URL="postgresql://sion_owner:$PGPASSWORD@127.0.0.1:15432/auto_ontology"
          psql "$URL" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE sion_nvidia_ci"
          export URL="postgresql://sion_owner:$PGPASSWORD@127.0.0.1:15432/sion_nvidia_ci"
          psql "$URL" -X -v ON_ERROR_STOP=1 -f migrations/001_core.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -f migrations/004_seed_core_types.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -f integrations/nvidia-auto-ontology/ci/seed.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -v project_id=00000000-0000-0000-0000-0000000000a1 -v role_password=ci_only_test_password_0101 -f integrations/nvidia-auto-ontology/ci/readonly.sql
          # CI-only worker concurrency cap; grants remain read-only on one security-barrier view.
          psql "$URL" -X -v ON_ERROR_STOP=1 -c "ALTER ROLE nvidia_pilot_reader CONNECTION LIMIT 16"
          PGPASSWORD=ci_only_test_password_0101 psql -X -h 127.0.0.1 -p 15432 -U nvidia_pilot_reader -d sion_nvidia_ci -A -t -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM sion_nv_pilot.verified_project_objects" | grep -qx 2

      - name: Build and boot actual NVIDIA frontend, backend and ingestion
        working-directory: nvidia
        run: |
          # Upstream images apt-get from Ubuntu during docker build. A runner DNS
          # blip makes archive.ubuntu.com unresolvable and fails the step before
          # any Sion or NVIDIA assertion. Retry that fetch; a real package or
          # compile error still fails after the last attempt.
          compose=(docker compose -f docker-compose.yml -f ../integrations/nvidia-auto-ontology/ci/docker-compose.ci.yml)
          for attempt in 1 2 3; do
            if "${compose[@]}" up -d --build --wait auto-ontology-frontend; then
              exit 0
            fi
            echo "NVIDIA image build attempt ${attempt} failed"
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Set up Sion Python HTTP test environment
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned HTTP/test packages
        run: uv sync --locked --extra test

      - name: Diagnose isolated reader capacity and catalog counts (no secrets)
        run: uv run --no-sync python integrations/nvidia-auto-ontology/ci/official_catalog_diagnostics.py

      - name: Real official ontology compilation plus NL2SQL on synthetic project
        run: uv run --no-sync python integrations/nvidia-auto-ontology/ci/official_live_pipeline.py

      - name: Service status only (never print container logs)
        if: always()
        working-directory: nvidia
        run: |
          docker compose -f docker-compose.yml -f ../integrations/nvidia-auto-ontology/ci/docker-compose.ci.yml ps || true
          df -h /

      - name: Destroy temporary NVIDIA and Sion CI Docker services only
        if: always()
        working-directory: nvidia
        run: |
          docker compose -f docker-compose.yml -f ../integrations/nvidia-auto-ontology/ci/docker-compose.ci.yml down -v --remove-orphans || true
          rm -f .env
