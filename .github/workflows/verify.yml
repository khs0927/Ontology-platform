name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: SQLite and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest -q

  postgres-migrations:
    name: PostgreSQL migration verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: ontology
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology -d ontology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SION_TEST_POSTGRES_URL: postgresql://ontology:ontology@127.0.0.1:5432/ontology
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The pgvector service image already ships psql/pg_isready of the matching major version,
      # and pg_dump/pg_restore were already run through `docker exec` below. Installing a host
      # client with apt made this job depend on the Ubuntu archive being resolvable from the
      # runner; that DNS lookup intermittently failed ("Temporary failure resolving
      # 'archive.ubuntu.com'") and burned the whole 10-minute timeout before failing.
      - name: Wait for PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for attempt in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U ontology -d ontology; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Apply canonical migrations twice
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for replay in 1 2; do
            for migration in \
              migrations/001_core.sql \
              migrations/002_vector.sql \
              migrations/004_seed_core_types.sql \
              migrations/006_outbox.sql \
              migrations/007_relation_type_validates.sql; do
              docker exec -i "$PG_CONTAINER" psql -U ontology -d ontology -X -v ON_ERROR_STOP=1 -f - < "$migration"
            done
          done

      - name: Verify PostgreSQL schema and extensions
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U ontology -d ontology -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public') <> 11 THEN
              RAISE EXCEPTION 'expected 11 public tables after migrations (9 core + embeddings + outbox_events)';
            END IF;
            IF (SELECT count(*) FROM entity_types) <> 11 THEN
              RAISE EXCEPTION 'expected 11 canonical entity types';
            END IF;
            IF (SELECT count(*) FROM relation_types) <> 15 THEN
              RAISE EXCEPTION 'expected 15 canonical relation types';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pgcrypto') THEN
              RAISE EXCEPTION 'pgcrypto extension is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') THEN
              RAISE EXCEPTION 'pgvector extension is missing';
            END IF;
          END $$;
          SQL

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install project with regulation and rag extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[regulation,rag,test]"

      - name: Unified migration runner (core public + ArchOntos regulation schema), twice
        run: |
          python -m sion_api.migrate --dsn "$SION_TEST_POSTGRES_URL"
          python -m sion_api.migrate --dsn "$SION_TEST_POSTGRES_URL" | tee second-run.txt
          grep -q "core: applied 0" second-run.txt
          grep -q "regulation (regulation): applied 0" second-run.txt
          python -m sion_api.migrate --dsn "$SION_TEST_POSTGRES_URL" --status

      - name: Verify unified schema layout
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$PG_CONTAINER" psql -U ontology -d ontology -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM pg_tables WHERE schemaname = 'public') <> 12 THEN
              RAISE EXCEPTION 'expected 12 public tables (11 + sion_schema_migrations)';
            END IF;
            IF (SELECT count(*) FROM pg_tables WHERE schemaname = 'regulation') < 29 THEN
              RAISE EXCEPTION 'ArchOntos tables missing from schema regulation';
            END IF;
            IF to_regclass('public.outbox_message') IS NOT NULL OR to_regclass('public.rule') IS NOT NULL THEN
              RAISE EXCEPTION 'ArchOntos tables leaked into public';
            END IF;
          END $$;
          SQL

      - name: Unified PostgreSQL tests
        run: python -m pytest -q tests/test_unified_postgres.py

      # LightRAG's real Postgres storages (PGTableGraphStorage, pgvector) with a local hash
      # embedding: per-project workspaces stay separate in every LightRAG table.
      - name: GraphRAG on PostgreSQL
        run: python -m pytest -q tests/test_graphrag_postgres.py

      - name: Logical backup/restore smoke test (pg_dump -Fc -> pg_restore into a fresh DB)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Dump/restore run inside the service container so client and server versions match (pg17).
          docker exec "$PG_CONTAINER" pg_dump -U ontology -d ontology -Fc -f /tmp/ontology.dump
          docker exec "$PG_CONTAINER" createdb -U ontology ontology_restore
          docker exec "$PG_CONTAINER" pg_restore -U ontology -d ontology_restore --exit-on-error /tmp/ontology.dump
          fingerprint() {
            docker exec "$PG_CONTAINER" psql -U ontology -d "$1" -X -At -v ON_ERROR_STOP=1 -c "
              SELECT string_agg(format('%s.%s=%s', schemaname, tablename,
                       (xpath('/row/c/text()', query_to_xml(format('SELECT count(*) AS c FROM %I.%I', schemaname, tablename), false, true, '')))[1]::text),
                     ',' ORDER BY schemaname, tablename)
                     || ';vector=' || (SELECT extversion FROM pg_extension WHERE extname = 'vector')
                     || ';pgcrypto=' || (SELECT extversion FROM pg_extension WHERE extname = 'pgcrypto')
              FROM pg_tables WHERE schemaname IN ('public', 'regulation');"
          }
          src=$(fingerprint ontology)
          dst=$(fingerprint ontology_restore)
          echo "source:   $src"
          echo "restored: $dst"
          test -n "$src" && test "$src" = "$dst"
          python -m sion_api.migrate --dsn "${SION_TEST_POSTGRES_URL%/*}/ontology_restore" | tee restore-run.txt
          grep -q "core: applied 0" restore-run.txt
          grep -q "regulation (regulation): applied 0" restore-run.txt

  compose-smoke:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Start db, migrations and API
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          {
            echo "SION_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "SION_API_TOKENS_JSON={\"$token\": [\"*\"]}"
          } > .env
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"
          docker compose up -d --build --wait --wait-timeout 300

      - name: API answers with auth over PostgreSQL
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/entities)" = 401
          curl -sf -H "Authorization: Bearer $SMOKE_TOKEN" -H 'content-type: application/json' \
            -d '{"stable_key":"compose:smoke","entity_type_id":"Project","name":"Compose smoke"}' \
            http://127.0.0.1:8000/api/v1/entities
          test "$(docker compose exec -T db psql -U sion -d sion -Atc 'SELECT count(*) FROM outbox_events')" = 1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
