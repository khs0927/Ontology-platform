name: Verify API and PostgreSQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: ontology_platform
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ontology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontology -d ontology_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ONTOLOGY_PG_DSN: postgresql://ontology:ontology@127.0.0.1:5432/ontology_platform
      ONTOLOGY_TEST_POSTGRES_URL: postgresql+psycopg://ontology:ontology@127.0.0.1:5432/ontology_platform
      ONTOLOGY_DATABASE_URL: postgresql+psycopg://ontology:ontology@127.0.0.1:5432/ontology_platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install uv==0.12.17
          uv sync --locked --extra dev
      - name: Apply and replay migrations
        run: |
          sh scripts/apply_migrations.sh
          sh scripts/apply_migrations.sh
          uv run python scripts/verify_postgres.py
      - name: Test API against SQLite and PostgreSQL
        run: uv run pytest -q
      - name: Restore PostgreSQL backup and rerun integration tests
        run: |
          service_id=$(docker ps -q --filter ancestor=pgvector/pgvector:0.8.6-pg17)
          test -n "$service_id"
          docker exec "$service_id" pg_dump -U ontology -d ontology_platform -Fc -f /tmp/ontology-platform-ci.dump
          docker cp "$service_id:/tmp/ontology-platform-ci.dump" "$RUNNER_TEMP/ontology-platform-ci.dump"
          test -s "$RUNNER_TEMP/ontology-platform-ci.dump"
          docker exec "$service_id" createdb -U ontology ontology_restore_test
          docker exec "$service_id" pg_restore -U ontology --no-owner --no-acl -d ontology_restore_test /tmp/ontology-platform-ci.dump
          for table in entities artifacts documents chunks relations evidence; do
            original=$(docker exec "$service_id" psql -U ontology -d ontology_platform -Atc "SELECT count(*) FROM $table")
            restored=$(docker exec "$service_id" psql -U ontology -d ontology_restore_test -Atc "SELECT count(*) FROM $table")
            test "$original" = "$restored"
          done
          ONTOLOGY_DATABASE_URL=postgresql+psycopg://ontology:ontology@127.0.0.1:5432/ontology_restore_test uv run python scripts/verify_postgres.py
          ONTOLOGY_TEST_POSTGRES_URL=postgresql+psycopg://ontology:ontology@127.0.0.1:5432/ontology_restore_test uv run pytest -q tests/test_postgres_integration.py
