name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with all optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests (all extras)
        run: python -m pytest

      - name: Build wheel and sdist
        run: python -m build

  uv-locked:
    name: uv.lock check + locked install (all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Locked sync (all extras + dev)
        run: uv sync --locked --extra all --extra dev

      - name: Tests (locked environment)
        run: uv run --locked pytest
