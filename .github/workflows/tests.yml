name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with all optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests (all extras)
        run: python -m pytest

      - name: Build wheel and sdist
        run: python -m build

  pytest-windows:
    name: pytest (windows-latest, all extras)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with all optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,dev]"

      - name: Run tests (all extras)
        run: python -m pytest

  uv-locked:
    name: uv.lock check + locked install (all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Locked sync (all extras + dev)
        run: uv sync --locked --extra all --extra dev

      - name: Tests (locked environment)
        run: uv run --locked pytest

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Coverage tracing is slower than the plain pytest job; keep a higher ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install package with all optional extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test,dev]"

      # pytest-cov is intentionally ad hoc: coverage stays out of pyproject.toml
      # and uv.lock so the declared/tested dependency set does not change.
      - name: Install pytest-cov
        run: python -m pip install "pytest-cov==7.1.0"

      # Informational only: no --cov-fail-under gate yet, so a low or dropping
      # coverage number cannot fail the pull request. Test failures still fail
      # the job (the report is uploaded with if: always() below).
      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
