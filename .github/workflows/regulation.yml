name: Regulation (ArchOntos)

# CI for packages/regulation (ArchOntos, merged via git subtree). Ported from the
# standalone ArchOntos ci.yml: lint, format, mypy, unit + real-PostgreSQL tests,
# non-root image + migrator, Helm render. Runs from the package directory.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/regulation

jobs:
  test:
    name: ArchOntos lint, types, tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: archontos
          POSTGRES_USER: archontos
          POSTGRES_PASSWORD: archontos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archontos -d archontos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARCHONTOS_TEST_DATABASE_URL: postgresql://archontos:archontos@localhost:5432/archontos
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q src apps tests
      - name: Build image (non-root) and run the migration runner from it
        run: |
          docker build -t archontos:ci .
          test "$(docker run --rm archontos:ci id -u)" = "10001"
          dsn=postgresql://archontos:archontos@localhost:5432/archontos
          docker run --rm --network host archontos:ci python -m archontos.db.migrate --dsn "$dsn"
          docker run --rm --network host archontos:ci python -m archontos.db.migrate --dsn "$dsn" | grep "applied 0"
          docker run --rm --network host archontos:ci python -m archontos.db.migrate --dsn "$dsn" --status
          # Shared-database mode used by the Sion monorepo: dedicated schema.
          docker run --rm --network host archontos:ci python -m archontos.db.migrate --dsn "$dsn" --schema regulation_ci
          docker run --rm --network host archontos:ci python -m archontos.db.migrate --dsn "$dsn" --schema regulation_ci | grep "applied 0"
          docker run --rm --network host -e ARCHONTOS_APP_DB_PASSWORD=ci-svc archontos:ci \
            python -m archontos.db.roles ensure-login --name archontos_svc --dsn "$dsn"
          svc=postgresql://archontos_svc:ci-svc@localhost:5432/archontos
          docker run --rm --network host archontos:ci python -m archontos.db.roles check --dsn "$svc"
          if docker run --rm --network host archontos:ci python -m archontos.db.roles check --dsn "$dsn"; then
            echo "superuser DSN passed the privilege check" >&2; exit 1
          fi
          for m in ingestion normalization rule_engine projection action; do
            docker run --rm archontos:ci python -c "import apps.$m"
          done

  helm:
    name: ArchOntos Helm render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint and render
        working-directory: packages/regulation/deploy/helm/archontos
        run: |
          helm lint .
          helm template t . > /dev/null
          out=$(helm template t . --set autoscaling.enabled=true \
            --set services.projection.autoscaling.enabled=false)
          test "$(grep -c 'kind: HorizontalPodAutoscaler' <<<"$out")" = "4"
