name: Regulation (ArchOntos dependency)

# ArchOntos is a pinned git dependency (regulation extra), not vendored code. Its own lint,
# types, unit + PostgreSQL tests, image and Helm chart run in khs0927/ArchOntos CI. Here we
# check the pin (pyproject / uv.lock / docs / installed commit), the no-re-vendoring guard,
# the Sion bridge to the rule evaluator, and that the packaged migrations apply into the
# shared database's `regulation` schema.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency:
    name: ArchOntos pin, guard, bridge, migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: sion
          POSTGRES_USER: sion
          POSTGRES_PASSWORD: sion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sion -d sion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install (regulation extra pulls archontos from khs0927/ArchOntos at the pin)
        run: python -m pip install -e ".[regulation,test]"
      - name: Pin, guard and bridge tests
        run: python -m pytest -q tests/test_archontos_dependency.py tests/test_regulation_bridge.py
      - name: ArchOntos migrations (from the installed package) into schema regulation, twice
        run: |
          dsn=postgresql://sion:sion@localhost:5432/sion
          python -m sion_api.migrate --dsn "$dsn"
          python -m sion_api.migrate --dsn "$dsn" | tee second.txt
          grep -q "regulation (regulation): applied 0" second.txt
