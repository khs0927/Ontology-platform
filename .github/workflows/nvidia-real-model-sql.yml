name: NVIDIA real model SQL accuracy against project-restricted Sion view

on:
  push:
    branches: [feat/nvidia-auto-ontology-federation-20261107]
    paths:
      - .github/workflows/nvidia-real-model-sql.yml
      - integrations/nvidia-auto-ontology/ci/nvidia_model_sql_goldens.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-sql:
    if: github.repository == 'khs0927/Ontology-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sion_owner
          POSTGRES_PASSWORD: ci_synthetic_only_password
          POSTGRES_DB: sion_nvidia_ci
        ports: ['15432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create approved synthetic Sion project view
        env:
          PGPASSWORD: ci_synthetic_only_password
        run: |
          export URL="postgresql://sion_owner:$PGPASSWORD@127.0.0.1:15432/sion_nvidia_ci"
          psql "$URL" -X -v ON_ERROR_STOP=1 -f migrations/001_core.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -f migrations/004_seed_core_types.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -f integrations/nvidia-auto-ontology/ci/seed.sql
          psql "$URL" -X -v ON_ERROR_STOP=1 -v project_id=00000000-0000-0000-0000-0000000000a1 -v role_password=ci_only_test_password_0101 -f integrations/nvidia-auto-ontology/ci/readonly.sql
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test
      - name: Sixteen real-model NL2SQL safety and accuracy goldens
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SION_NVIDIA_PILOT_RO_DSN: postgresql://nvidia_pilot_reader:ci_only_test_password_0101@127.0.0.1:15432/sion_nvidia_ci
        run: uv run --no-sync python integrations/nvidia-auto-ontology/ci/nvidia_model_sql_goldens.py
