name: AEC drawing-context headless (cross-OS)

# Ported from khs0927/Ontology PR #88. The drawing-context safety contracts are
# pure-Python and need only pytest, so they run on every desktop runner OS to
# catch path-separator and other portability regressions (aec.yml covers Linux
# with the full package install). Nothing here starts a CAD host.

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/aec/extensions/drawing_context/**"
      - "packages/aec/scripts/verify_source_mapping.py"
      - "packages/aec/scripts/compare_rag_results.py"
      - ".github/workflows/aec-drawing-context-headless.yml"
  push:
    branches: [main]
    paths:
      - "packages/aec/extensions/drawing_context/**"
      - "packages/aec/scripts/verify_source_mapping.py"
      - "packages/aec/scripts/compare_rag_results.py"
      - ".github/workflows/aec-drawing-context-headless.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: drawing-context contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/aec
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: python -m pip install pytest
      - name: Compile portable drawing-context code
        run: python -m compileall -q extensions/drawing_context scripts/verify_source_mapping.py scripts/compare_rag_results.py
      - name: Run drawing-context contracts
        env:
          PYTHONPATH: extensions/drawing_context
        run: python -m pytest -q extensions/drawing_context/tests
