name: AEC CAIR federation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/aec-cair-federation-*"

permissions:
  contents: read

jobs:
  aec-federation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q apps packages
      - name: Test AEC federation
        run: python -m pytest -q tests/test_aec_cair_adapter.py tests/test_api.py
