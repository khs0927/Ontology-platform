[project]
name = "aec-assets-mcp"
version = "0.1.0"
description = "Free CC0 architecture assets (Poly Haven, ambientCG) for SketchUp via MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp~=1.20",
    "httpx>=0.27",
    "trimesh>=4.0",
    "pillow",
    "fast-simplification>=0.2.0",
    "scipy>=1.15.3",
]
[project.scripts]
aec-assets-mcp = "aec_assets_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest"]
